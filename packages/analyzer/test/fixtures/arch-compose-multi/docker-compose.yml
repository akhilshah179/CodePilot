services:
  gateway:
    image: nginx:1.27
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - orders

  orders:
    build: ./orders
    environment:
      - INVENTORY_URL=http://inventory:5000
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      - kafka
      - inventory

  inventory:
    build: ./inventory
    environment:
      - KAFKA_BOOTSTRAP=kafka:9092

  notifier:
    build: ./notifier
    environment:
      - KAFKA_BROKERS=kafka:9092
      - SMTP_HOST=smtp.example.org

  kafka:
    image: bitnami/kafka:3.7
